<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links Gastro</title>
<script>
  var APP = 'https://script.google.com/a/macros/gastrobsas.com.ar/s/AKfycbyxs6RTu9IRiwCDEetHDf8bJscXZGKbxbbH9HhEEfexz_g3tvEdoxB66NYcYBjcWvV22w/exec';

  var partes = location.pathname.split('/').filter(Boolean);
  if (partes[0] === 'links-gastro') partes.shift();   // quita el nombre del repo
  var alias = (partes[0] || '').toLowerCase();
  location.replace(alias ? APP + '?go=' + encodeURIComponent(alias) : APP);
</script>
<style>
  body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#1e3a8a);
       min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff}
  .spin{width:46px;height:46px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;
        animation:s .8s linear infinite;margin:0 auto 20px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body><div style="text-align:center"><div class="spin"></div>Abriendo…</div></body>
</html>
